import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipInputStream
import java.util.zip.ZipOutputStream
import org.gradle.api.artifacts.transform.CacheableTransform
import org.gradle.api.artifacts.transform.InputArtifact
import org.gradle.api.artifacts.transform.TransformAction
import org.gradle.api.artifacts.transform.TransformOutputs
import org.gradle.api.artifacts.transform.TransformParameters
import org.gradle.api.artifacts.type.ArtifactTypeDefinition

plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

if (JavaVersion.current() != JavaVersion.VERSION_17) {
    throw new GradleException('Run Gradle with a standard Java 17 JDK.')
}
if (new File(System.getProperty('java.home'), 'jmods/javafx.base.jmod').exists() ||
        ModuleLayer.boot().findModule('javafx.base').isPresent()) {
    throw new GradleException('Use a standard Java 17 JDK, not a JavaFX-bundled Full JDK.')
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

javafx {
    version = '17.0.19'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'virtual_robot.controller.VirtualRobotApplication'
}

sourceSets {
    main {
        java {
            srcDirs = ['Controller/src', 'TeamCode/src']
            // These implementations are supplied by the published Dashboard artifacts.
            exclude 'com/acmerobotics/dashboard/canvas/**'
            exclude 'com/acmerobotics/dashboard/telemetry/TelemetryPacket.java'
            exclude 'com/acmerobotics/dashboard/telemetry/MultipleTelemetry.java'
            exclude 'com/acmerobotics/dashboard/config/Config.java'
        }
        resources {
            srcDirs = ['Controller/src', 'TeamCode/src']
            exclude '**/*.java', '**/*.class'
        }
    }
    test {
        java.srcDirs = ['Controller/test']
    }
}

@CacheableTransform
abstract class DesktopAarJar implements TransformAction<DesktopAarJar.Parameters> {
    interface Parameters extends TransformParameters {
        @Input
        ListProperty<String> getClassPrefixes()
    }

    @InputArtifact
    @PathSensitive(PathSensitivity.NONE)
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        def aar = inputArtifact.get().asFile
        def entries = new TreeMap<String, byte[]>()
        new ZipFile(aar).withCloseable { archive ->
            def classes = archive.getEntry('classes.jar')
            if (classes == null) {
                throw new GradleException("No classes.jar in ${aar.name}")
            }
            new ZipInputStream(archive.getInputStream(classes)).withCloseable { jar ->
                ZipEntry entry
                while ((entry = jar.nextEntry) != null) {
                    if (!entry.directory && entry.name.endsWith('.class') &&
                            parameters.classPrefixes.get().any { prefix ->
                                prefix.endsWith('/') ? entry.name.startsWith(prefix) :
                                        entry.name == "${prefix}.class" || entry.name.startsWith("${prefix}\$")
                            }) {
                        if (entries.put(entry.name, jar.readAllBytes()) != null) {
                            throw new GradleException("Duplicate class ${entry.name}")
                        }
                    }
                }
            }
        }
        if (entries.isEmpty()) {
            throw new GradleException("No desktop classes selected from ${aar.name}")
        }
        def output = outputs.file("${aar.name - '.aar'}-desktop.jar")
        new ZipOutputStream(new FileOutputStream(output)).withCloseable { jar ->
            entries.each { path, bytes ->
                def entry = new ZipEntry(path)
                entry.time = 0L
                jar.putNextEntry(entry)
                jar.write(bytes)
                jar.closeEntry()
            }
        }
    }
}

def aarJar = { String name, String coordinate, List<String> prefixes ->
    def artifactType = ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE
    String desktopType = "desktop-${name}"
    // Resolution also runs during IDE sync; task outputs would remain missing after clean.
    dependencies.registerTransform(DesktopAarJar) {
        from.attribute(artifactType, 'aar')
        to.attribute(artifactType, desktopType)
        parameters.classPrefixes.set(prefixes)
    }
    def donor = configurations.create("${name}Donor") {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
        attributes.attribute(artifactType, desktopType)
    }
    dependencies.add(donor.name, "${coordinate}@aar")
    dependencies.add('implementation', files(donor))
}

aarJar('dashboard', 'com.acmerobotics.dashboard:dashboard:0.4.16', [
        'com/acmerobotics/dashboard/config/Config',
        'com/acmerobotics/dashboard/telemetry/MultipleTelemetry'
])

// Only JVM helpers are donated: no Android tuner, webserver, or FlightRecorder.
