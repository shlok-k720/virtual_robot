dependencies {
    implementation 'com.acmerobotics.dashboard:core:0.4.16'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.acmerobotics.roadrunner:core:1.0.1'
    implementation 'com.acmerobotics.roadrunner:actions:1.0.1'
    implementation 'com.pedropathing:core:3.0.0'
    implementation 'com.pedropathing.ivy:core:1.1.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
    implementation 'com.badlogicgames.jamepad:jamepad:2.30.0.0'
    implementation 'org.dyn4j:dyn4j:4.1.4'
    implementation 'org.reflections:reflections:0.9.11'
    implementation 'androidx.annotation:annotation-jvm:1.9.1'
    implementation 'virtualrobot.compat:EasyOpenCV_v1.5.0_OBJ_bundle:1.5.0@jar'
    // AprilTagDetectorJNI still imports this build-time type; do not ship it at runtime.
    compileOnly('com.badlogicgames.gdx:gdx-jnigen:2.2.0') { transitive = false }
}

def javafxVerification = ['linux', 'linux-aarch64', 'mac', 'mac-aarch64', 'win'].collect { platform ->
    def platformArtifacts = configurations.create("javafxVerification${platform.replace('-', '_')}") {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    ['base', 'graphics', 'controls', 'fxml'].each { module ->
        dependencies.add(platformArtifacts.name, "org.openjfx:javafx-${module}:17.0.19:${platform}@jar")
    }
    platformArtifacts
}
tasks.register('resolveJavafxPlatforms') {
    inputs.files(javafxVerification)
    doLast { javafxVerification.each { it.files.each { logger.info("Verified ${it.name}") } } }
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.register('verifyDesktopClasspath') {
    dependsOn configurations.runtimeClasspath
    doLast {
        def seen = [:]
        configurations.runtimeClasspath.files.findAll { it.name.endsWith('.jar') }.each { file ->
            new ZipFile(file).withCloseable { jar ->
                jar.entries().each { entry ->
                    if (entry.name.endsWith('.class') && !entry.name.startsWith('META-INF/') &&
                            entry.name != 'module-info.class') {
                        if (entry.name.startsWith('android/') ||
                                entry.name.startsWith('com/qualcomm/') ||
                                entry.name.startsWith('org/firstinspires/ftc/robotcore/')) {
                            throw new GradleException("Desktop classpath contains SDK/Android class ${entry.name} in ${file.name}")
                        }
                        def previous = seen.put(entry.name, file.name)
                        if (previous != null) {
                            throw new GradleException("Duplicate class ${entry.name} in ${previous} and ${file.name}")
                        }
                    }
                }
            }
        }
    }
}

tasks.register('simulatorCompatibilityTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'virtual_robot.util.SimulatedLazyImuTest'
    enableAssertions = true
}

tasks.named('check') { dependsOn 'verifyDesktopClasspath', 'simulatorCompatibilityTest' }
tasks.named('startScripts') {
    doLast {
        def javafxJars = configurations.runtimeClasspath.files.findAll {
            it.name.startsWith('javafx-') && it.name.endsWith('.jar')
        }.collect { it.name }.sort()
        def unixModulePath = javafxJars.collect { "\$APP_HOME/lib/${it}" }.join(':')
        def windowsModulePath = javafxJars.collect { "%APP_HOME%\\lib\\${it}" }.join(';')
        if (javafxJars.size() != 4 ||
                !unixScript.text.contains('-classpath "$CLASSPATH"') ||
                !windowsScript.text.contains('-classpath "%CLASSPATH%"')) {
            throw new GradleException('Cannot configure JavaFX distribution module paths')
        }
        unixScript.text = unixScript.text.replace(
                '-classpath "$CLASSPATH"',
                "--module-path \"${unixModulePath}\" --add-modules javafx.controls,javafx.fxml -classpath \"\$CLASSPATH\"")
        windowsScript.text = windowsScript.text.replace(
                '-classpath "%CLASSPATH%"',
                "--module-path \"${windowsModulePath}\" --add-modules javafx.controls,javafx.fxml -classpath \"%CLASSPATH%\"")
    }
}
tasks.named('run') {
    dependsOn 'verifyDesktopClasspath'
}
